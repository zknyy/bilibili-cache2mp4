name: Build Executables

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build run-dir-all executable with PyInstaller
        run: |
          pyinstaller --clean --onefile --name run-dir-all run-dir-all.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-cache2mp4-${{ matrix.os }}
          path: dist/*

  release:
    name: Create release on main push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set release tag and name
        run: |
          timestamp=$(date -u +'%Y%m%d%H%M%S')
          echo "RELEASE_TAG=v${timestamp}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release ${timestamp}" >> $GITHUB_ENV

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: "Automated release created on push to main."
          draft: false
          prerelease: false

      - name: Upload Linux executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/bilibili-cache2mp4-ubuntu-latest/run-dir-all
          asset_name: run-dir-all-ubuntu
          asset_content_type: application/octet-stream

      - name: Upload macOS executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/bilibili-cache2mp4-macos-latest/run-dir-all
          asset_name: run-dir-all-macos
          asset_content_type: application/octet-stream

      - name: Upload Windows executable
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/bilibili-cache2mp4-windows-latest/run-dir-all.exe
          asset_name: run-dir-all-windows.exe
          asset_content_type: application/octet-stream
