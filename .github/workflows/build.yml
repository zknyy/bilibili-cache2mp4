name: Build Executables

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*'
  workflow_dispatch: {}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build run-dir-all executable with PyInstaller
        run: |
          pyinstaller --clean --onefile --name run-dir-all run-dir-all.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-cache2mp4-${{ matrix.os }}
          path: dist/*

  release:
    name: Create release on main push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release tag and name
        run: |
          timestamp=$(date -u +'%Y%m%d%H%M%S')
          echo "RELEASE_TAG=v${timestamp}" >> $GITHUB_ENV
          echo "RELEASE_NAME=Release ${timestamp}" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release and upload executables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
        run: |
          files=$(find artifacts -type f | tr '\n' ' ')
          echo "Uploading release ${RELEASE_TAG} with files: $files"
          gh release create "$RELEASE_TAG" $files --title "$RELEASE_NAME" --notes "Automated release created on push to main."
